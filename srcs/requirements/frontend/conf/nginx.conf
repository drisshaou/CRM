server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls go to the NestJS service on the compose network.
    # No trailing slash on proxy_pass: the /api prefix is kept,
    # since Nest serves its routes under /api.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_hide_header X-Powered-By;
    }

    # Hashed build assets never change: let the browser cache them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else: the single page.
    location / {
        try_files $uri /index.html;
    }
}